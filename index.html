<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tiptoe — Простір для дітей 2-6 років</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'Nunito', Arial, sans-serif;
      background: #fff8ef;
      color: #3d3a4f;
      text-align: center;
      overflow-x: hidden;
    }

    .card {
      position: relative;
      max-width: 560px;
      width: 100%;
      padding: 56px 32px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 12px 40px rgba(61, 58, 79, 0.08);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .dots span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      animation: hop 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(1) { background: #ff8a7a; }
    .dots span:nth-child(2) { background: #ffc84a; animation-delay: .15s; }
    .dots span:nth-child(3) { background: #6cc7a8; animation-delay: .3s; }
    .dots span:nth-child(4) { background: #7aa9ff; animation-delay: .45s; }

    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: clamp(48px, 12vw, 80px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #ff8a7a;
      line-height: 1;
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 700;
    }

    .status {
      display: inline-block;
      margin-top: 32px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #eaf7f2;
      color: #2f8a6a;
      font-weight: 700;
      font-size: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      .dots span { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <h1>tiptoe</h1>
    <p class="subtitle">Простір для дітей 2-6 років</p>
    <p class="status">🛠 Сайт у розробці</p>
  </main>
</body>
</html>
